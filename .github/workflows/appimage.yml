# Builds imagesearcher-x86_64.AppImage (appimage/build.sh: portable CPython + PySide6 + the app, packed by the
# official appimagetool). Runs by hand (Actions -> AppImage -> Run workflow) or for a pushed v* tag, which also
# attaches the AppImage to that tag's GitHub Release.
name: AppImage
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Qt's system libraries (desktops have them; the bare CI image doesn't)
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libglib2.0-0 xvfb libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xkb1 libxkbcommon-x11-0 libnss3 libasound2
      - name: Build
        run: bash appimage/build.sh
      - name: Self-check inside the AppImage
        run: APPIMAGE_EXTRACT_AND_RUN=1 ./imagesearcher-x86_64.AppImage --selftest
      - name: Start the real app on a virtual display (must still be running after 20 s, with WebP and the browser engine)
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=xcb
          set +e
          xvfb-run -a timeout 20 ./imagesearcher-x86_64.AppImage 2>&1 | tee run.log
          code=${PIPESTATUS[0]}
          set -e
          [ "$code" = 124 ] || { echo "the app exited by itself with code $code"; exit 1; }
          grep -q "started: Python" run.log
          ! grep -qE "Traceback|unhandled error|can't decode WebP|Could not load the Qt platform" run.log
      - uses: actions/upload-artifact@v4
        with:
          name: imagesearcher-x86_64.AppImage
          path: imagesearcher-x86_64.AppImage
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Linux AppImage: download, chmod +x, run."
          gh release upload "$GITHUB_REF_NAME" imagesearcher-x86_64.AppImage --clobber
